<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: url("../../../game/fonts/barlow-condensed-800.woff2") format("woff2");
        font-weight: 800;
      }
      html,
      body {
        margin: 0;
        background: radial-gradient(ellipse at 50% 55%, #2e1d12 0%, #140c08 60%, #080504 100%);
        width: 1600px;
        height: 560px;
        overflow: hidden;
      }
      body.light {
        background: #c99a62;
      }
      body.clear {
        background: transparent;
      }
      svg {
        display: block;
      }
      text {
        font-family: "Barlow Condensed";
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <svg id="logo" width="1600" height="560" viewBox="0 0 1600 560">
      <defs>
        <pattern id="sandstone" patternUnits="userSpaceOnUse" width="240" height="240">
          <image href="../../../game/textures/court-sandstone-albedo.webp" width="240" height="240" />
        </pattern>
        <pattern id="sand" patternUnits="userSpaceOnUse" width="180" height="180">
          <image href="../../../game/textures/sand-grain-albedo.webp" width="180" height="180" />
        </pattern>
        <pattern id="stone" patternUnits="userSpaceOnUse" width="280" height="280">
          <image href="../../../game/textures/stone-mineral-albedo.webp" width="280" height="280" />
        </pattern>
        <pattern id="masonry" patternUnits="userSpaceOnUse" width="300" height="300">
          <image href="../../../game/textures/masonry-aged-albedo.webp" width="300" height="300" />
        </pattern>
        <pattern id="strata" patternUnits="userSpaceOnUse" width="260" height="260">
          <image href="../../../game/textures/rock-strata-albedo.webp" width="260" height="260" />
        </pattern>
        <pattern id="snow" patternUnits="userSpaceOnUse" width="220" height="220">
          <image href="../../../game/textures/snow-grain-albedo.webp" width="220" height="220" />
        </pattern>
        <pattern id="bark" patternUnits="userSpaceOnUse" width="240" height="240">
          <image href="../../../game/textures/bark-weathered-albedo.webp" width="240" height="240" />
        </pattern>
        <pattern id="ivy" patternUnits="userSpaceOnUse" width="46" height="46" patternTransform="rotate(18)">
          <image href="../../../game/textures/ivy-leaf-albedo.webp" width="46" height="46" />
        </pattern>
        <filter id="basalt" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.36 0 0 0 0.05  0 0.32 0 0 0.04  0 0 0.42 0 0.09  0 0 0 1 0" />
        </filter>
        <filter id="ice" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.5 0 0 0 0.2  0 0.66 0 0 0.3  0 0 0.72 0 0.38  0 0 0 1 0" />
        </filter>
        <filter id="drowned" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.22 0 0 0 0.02  0 0.46 0 0 0.12  0 0 0.6 0 0.24  0 0 0 1 0" />
        </filter>
        <filter id="vault" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.42 0 0 0 0.04  0 0.34 0 0 0.03  0 0 0.3 0 0.03  0 0 0 1 0" />
        </filter>
        <filter id="isle" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="1.05 0 0 0 0.08  0 1 0 0 0.06  0 0 0.86 0 0.02  0 0 0 1 0" />
        </filter>
        <filter id="moss" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="0.5 0 0 0 0.02  0 0.8 0 0 0.06  0 0 0.35 0 0  0 0 0 1 0" />
        </filter>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="soft" x="-50%" y="-80%" width="200%" height="260%">
          <feGaussianBlur stdDeviation="9" />
        </filter>
        <filter id="puff" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
        <filter id="caustics" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="turbulence" baseFrequency="0.018 0.045" numOctaves="2" seed="11" />
          <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.95  0 0 0 0 1  3 0 0 0 -0.55" />
        </filter>
        <!-- One light over the whole word: lit from above, darker at the foot, with a carved edge. -->
        <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.28" />
          <stop offset="0.45" stop-color="#fff" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity="0.38" />
        </linearGradient>
        <filter id="carve" x="-5%" y="-10%" width="110%" height="130%">
          <feOffset dx="0" dy="7" in="SourceAlpha" result="drop" />
          <feFlood flood-color="#2c170b" />
          <feComposite in2="drop" operator="in" result="edge" />
          <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur" />
          <feOffset dy="26" in="blur" result="shadow" />
          <feFlood flood-color="#000" flood-opacity="0.55" />
          <feComposite in2="shadow" operator="in" result="shadow2" />
          <feMerge>
            <feMergeNode in="shadow2" />
            <feMergeNode in="edge" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <g id="back"></g>
      <g id="word" filter="url(#carve)"></g>
      <g id="front"></g>
    </svg>
    <script type="module">
      await document.fonts.load('800 300px "Barlow Condensed"');
      if (location.hash === "#light") document.body.classList.add("light");
      if (location.hash === "#clear") {
        document.body.classList.add("clear");
        document.documentElement.style.background = "transparent";
      }
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.querySelector("#logo");
      const defs = svg.querySelector("defs");
      const [back, word, front] = ["#back", "#word", "#front"].map((s) => svg.querySelector(s));
      const make = (tag, attrs = {}, parent) => {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        parent?.appendChild(el);
        return el;
      };
      let seed = 7;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      // A ragged horizontal edge from x0 to x1 around y, `amp` deep, closed downward or upward.
      const ragged = (x0, x1, y, amp, step = 9) => {
        const points = [];
        for (let x = x0; x <= x1; x += step)
          points.push([x, y + Math.sin(x * 0.045) * amp * 0.45 + (rand() - 0.5) * amp]);
        return points;
      };
      const SIZE = 330;
      const probe = make("text", { x: 0, y: 0, "font-size": SIZE, "letter-spacing": 12 }, svg);
      probe.textContent = "FARSEEK";
      const width = probe.getComputedTextLength();
      const x0 = (1600 - width) / 2;
      const base = 390;
      const boxes = [...probe.textContent].map((_, i) => {
        const e = probe.getExtentOfChar(i);
        return { x: x0 + e.x, w: e.width };
      });
      probe.remove();
      const top = base - SIZE * 0.7;
      const height = SIZE * 0.7;
      const letter = (i, build) => {
        const id = `clip-${i}`;
        const clip = make("clipPath", { id }, defs);
        const t = make("text", { x: boxes[i].x, y: base, "font-size": SIZE }, clip);
        t.textContent = "FARSEEK"[i];
        const g = make("g", { "clip-path": `url(#${id})` }, word);
        build(g, boxes[i]);
        make("rect", { x: boxes[i].x - 20, y: top - 40, width: boxes[i].w + 40, height: height + 80, fill: "url(#light)" }, g);
      };
      const fill = (g, b, attrs) =>
        make("rect", { x: b.x - 20, y: top - 40, width: b.w + 40, height: height + 80, ...attrs }, g);
      const band = (g, b, y, amp, below, attrs) => {
        const edge = ragged(b.x - 40, b.x + b.w + 40, y, amp);
        const end = below ? base + 60 : top - 60;
        const d = `M${edge.map(([x, yy]) => `${x.toFixed(1)} ${yy.toFixed(1)}`).join(" L")} L${b.x + b.w + 40} ${end} L${b.x - 40} ${end}Z`;
        return make("path", { d, ...attrs }, g);
      };
      // F: sunken court sandstone; sand drifts against its foot and spills onto the ground.
      letter(0, (g, b) => {
        fill(g, b, { fill: "url(#sandstone)" });
        band(g, b, base - 58, 18, true, { fill: "url(#sand)" });
      });
      const F = boxes[0];
      const dune = ragged(F.x - 70, F.x + F.w + 90, base - 4, 6, 12);
      make("path", { d: `M${F.x - 90} ${base + 18} Q${F.x - 40} ${base - 22} ${F.x + F.w * 0.4} ${base - 10} T${F.x + F.w + 110} ${base + 18}Z`, fill: "url(#sand)", opacity: 0.95 }, front);
      // A: the checkpoint's night basalt, its lilac flora glowing at the foot.
      letter(1, (g, b) => {
        make("g", { filter: "url(#basalt)" }, g).append(fill(document.createElementNS(NS, "g"), b, { fill: "url(#stone)" }));
      });
      const A = boxes[1];
      for (const [dx, dy, r] of [[0.12, -6, 8], [0.24, -2, 5], [0.78, -8, 9], [0.9, -2, 5], [0.5, 4, 4]])
        make("circle", { cx: A.x + A.w * dx, cy: base + dy, r, fill: "#e6b0ff", filter: "url(#glow)" }, front);
      // R: a dawn isle: pale limestone on top, raw rock beneath, golden cloud under it.
      letter(2, (g, b) => {
        make("g", { filter: "url(#isle)" }, g).append(fill(document.createElementNS(NS, "g"), b, { fill: "url(#masonry)" }));
        band(g, b, base - 95, 22, true, { fill: "url(#strata)" });
      });
      const R = boxes[2];
      for (const [dx, dy, r, o] of [[-0.05, 6, 26, 0.75], [0.15, -4, 34, 0.85], [0.38, 4, 30, 0.85], [0.6, -6, 36, 0.9], [0.84, 4, 28, 0.8], [1.02, 8, 22, 0.7], [0.3, 18, 30, 0.6], [0.72, 18, 30, 0.6]])
        make("circle", { cx: R.x + R.w * dx, cy: base + dy, r, fill: "#fff1d2", filter: "url(#puff)", opacity: o }, front);
      // S: frozen reach ice under a cap of snow, icicles hanging from its upper curve.
      letter(3, (g, b) => {
        make("g", { filter: "url(#ice)" }, g).append(fill(document.createElementNS(NS, "g"), b, { fill: "url(#snow)" }));
        band(g, b, top + 30, 16, false, { fill: "url(#snow)" });
      });
      const S = boxes[3];
      for (const [dx, len] of [[0.16, 26], [0.26, 40], [0.36, 20], [0.48, 32], [0.6, 16], [0.7, 28]])
        make("path", { d: `M${S.x + S.w * dx - 5} ${base - 2} L${S.x + S.w * dx + 5} ${base - 2} L${S.x + S.w * dx} ${base - 2 + len}Z`, fill: "#e8f7fd", opacity: 0.92 }, front);
      // E: the wildwood: bark under moss and ivy, spores glowing lime.
      letter(4, (g, b) => {
        fill(g, b, { fill: "url(#bark)" });
        make("g", { filter: "url(#moss)" }, g).append(band(document.createElementNS(NS, "g"), b, top + 26, 14, false, { fill: "url(#ivy)" }));
      });
      const E = boxes[4];
      const leafGradient = make("linearGradient", { id: "leaf", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
      make("stop", { offset: 0, "stop-color": "#8fbf55" }, leafGradient);
      make("stop", { offset: 1, "stop-color": "#2e5a22" }, leafGradient);
      const LEAF = "M0 -1 C0.55 -1.05 0.95 -0.55 0.82 0.05 C0.7 0.55 0.3 0.8 0 1 C-0.3 0.8 -0.7 0.55 -0.82 0.05 C-0.95 -0.55 -0.55 -1.05 0 -1Z";
      // A vine down the left of the E and along its top bar, leaves turning as they go.
      const vine = [];
      for (let k = 0; k < 16; k++) vine.push([E.x + 8 + Math.sin(k * 0.9) * 10, top + 10 + k * (height / 15)]);
      for (let k = 1; k < 10; k++) vine.push([E.x + 8 + k * (E.w / 9), top + 8 + Math.sin(k * 1.3) * 8]);
      make("path", { d: `M${vine.slice(0, 16).map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L")}`, stroke: "#4a3a22", "stroke-width": 3, fill: "none" }, front);
      for (const [k, [vx, vy]] of vine.entries()) {
        const size = 9 + rand() * 7;
        const angle = (rand() - 0.5) * 120 + (k < 16 ? (k % 2 ? 70 : -70) : 180);
        const ox = (k < 16 ? (k % 2 ? 10 : -6) : 0) + (rand() - 0.5) * 6;
        const oy = k < 16 ? 0 : 10;
        make("path", { d: LEAF, transform: `translate(${(vx + ox).toFixed(1)} ${(vy + oy).toFixed(1)}) rotate(${angle.toFixed(0)}) scale(${size.toFixed(1)})`, fill: "url(#leaf)", stroke: "#1f3b16", "stroke-width": 0.08 }, front);
      }
      for (const [dx, dy] of [[0.95, 0.3], [0.7, 0.66], [1.02, 0.85], [0.2, 1.02]])
        make("circle", { cx: E.x + E.w * dx, cy: top + height * dy, r: 4.5, fill: "#d6ff6e", filter: "url(#glow)" }, front);
      // E: the drowned archive: dark wet stone under moving caustics, bubbles rising off it.
      letter(5, (g, b) => {
        make("g", { filter: "url(#drowned)" }, g).append(fill(document.createElementNS(NS, "g"), b, { fill: "url(#stone)" }));
        fill(g, b, { filter: "url(#caustics)", opacity: 0.7 });
      });
      const E2 = boxes[5];
      for (const [dx, dy, r] of [[0.92, -8, 6], [1.0, -34, 4.5], [0.86, -58, 3.5], [0.98, -80, 5]])
        make("circle", { cx: E2.x + E2.w * dx, cy: top + dy, r, fill: "rgba(200,240,255,0.15)", stroke: "#c6f0ff", "stroke-width": 1.8 }, front);
      // K: the builders' vault: dark masonry, amber light through its seams.
      letter(6, (g, b) => {
        make("g", { filter: "url(#vault)" }, g).append(fill(document.createElementNS(NS, "g"), b, { fill: "url(#masonry)" }));
        const crack = `M${b.x + b.w * 0.12} ${top - 10} L${b.x + b.w * 0.3} ${top + height * 0.3} L${b.x + b.w * 0.18} ${top + height * 0.52} L${b.x + b.w * 0.34} ${top + height * 0.78} L${b.x + b.w * 0.24} ${base + 10}`;
        make("path", { d: crack, stroke: "#ffb24a", "stroke-width": 9, fill: "none", filter: "url(#glow)", opacity: 0.85 }, g);
        make("path", { d: crack, stroke: "#fff1c8", "stroke-width": 2.5, fill: "none" }, g);
      });
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
